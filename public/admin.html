<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Daftar Pesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 md:p-10">

    <!-- Form Login Admin -->
    <div id="loginCard" class="max-w-sm mx-auto bg-white p-6 rounded-lg shadow mt-20">
        <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Login Admin</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Kata Sandi</label>
                <input type="password" id="adminPassInput" required class="w-full mt-1 p-2 border rounded-md" placeholder="Masukkan password admin">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md">Masuk</button>
        </form>
    </div>

    <!-- Panel Pesanan (Terkunci sebelum login) -->
    <div id="adminPanel" class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Panel Kelola Pesanan</h1>
            <div class="space-x-2">
                <button onclick="loadOrders()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-md">Muat Ulang Data</button>
                <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-md">Keluar</button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-sm text-gray-600">
                        <th class="p-3">ID Pesanan</th>
                        <th class="p-3">Waktu</th>
                        <th class="p-3">Nama</th>
                        <th class="p-3">WhatsApp</th>
                        <th class="p-3">IMEI</th>
                        <th class="p-3">Paket</th>
                        <th class="p-3">Tagihan</th>
                        <th class="p-3">Status Saat Ini</th>
                        <th class="p-3 text-center">Aksi Status</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody" class="text-sm divide-y"></tbody>
            </table>
        </div>
    </div>

    <script>
        const loginCard = document.getElementById('loginCard');
        const adminPanel = document.getElementById('adminPanel');
        const loginForm = document.getElementById('loginForm');
        const adminPassInput = document.getElementById('adminPassInput');

        function getAuthToken() {
            return sessionStorage.getItem('admin_token');
        }

        // Cek apakah admin sudah pernah login di tab ini
        if (getAuthToken()) {
            showDashboard();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = adminPassInput.value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_token', password);
                    showDashboard();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Gagal menghubungi server');
            }
        });

        function showDashboard() {
            loginCard.classList.add('hidden');
            adminPanel.classList.remove('hidden');
            loadOrders();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('admin_token');
            adminPanel.classList.add('hidden');
            loginCard.classList.remove('hidden');
            adminPassInput.value = '';
        }

        async function loadOrders() {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-gray-500">Memuat data...</td></tr>';

            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-password': getAuthToken() }
                });

                if (res.status === 401) {
                    logoutAdmin();
                    return;
                }

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-gray-500">Belum ada pesanan masuk.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(order => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-mono font-bold text-gray-800">${order.id}</td>
                        <td class="p-3 text-gray-500">${order.createdAt}</td>
                        <td class="p-3">${order.name}</td>
                        <td class="p-3">${order.phone}</td>
                        <td class="p-3 font-mono">${order.imei}</td>
                        <td class="p-3 font-medium text-gray-700">${order.package || '-'}</td>
                        <td class="p-3 font-semibold text-gray-900">Rp ${Number(order.price || 0).toLocaleString('id-ID')}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-semibold ${
                                order.status === 'Selesai' ? 'bg-green-100 text-green-800' :
                                order.status === 'Diproses' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800'
                            }">${order.status}</span>
                        </td>
                        <td class="p-3 text-center space-x-1">
                            <button onclick="updateStatus('${order.id}', 'Diproses')" class="text-xs bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded">Proses</button>
                            <button onclick="updateStatus('${order.id}', 'Selesai')" class="text-xs bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded">Selesai</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-red-500">Gagal memuat data dari server.</td></tr>';
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch('/api/admin/orders/update-status', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-password': getAuthToken()
                    },
                    body: JSON.stringify({ id, status: newStatus })
                });
                const result = await res.json();
                if (result.success) {
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('Gagal memperbarui status');
            }
        }
    </script>
</body>
</html>
