<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Daftar Pesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen p-4 sm:p-6 md:p-10 text-slate-100">

    <!-- Form Login Admin -->
    <div id="loginCard" class="max-w-sm mx-auto bg-slate-800/90 border border-slate-700/80 p-6 rounded-2xl shadow-2xl mt-20">
        <h2 class="text-xl font-bold text-white mb-4 text-center">Login Admin Layanan</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Kata Sandi</label>
                <input type="password" id="adminPassInput" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Masukkan password admin">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">Masuk</button>
        </form>
    </div>

    <!-- Panel Pesanan (Terkunci sebelum login) -->
    <div id="adminPanel" class="max-w-7xl mx-auto bg-slate-800/80 border border-slate-700/70 p-6 rounded-2xl shadow-2xl hidden">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b border-slate-700/60 pb-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-white">Panel Kelola Pesanan</h1>
                <p class="text-xs text-slate-400 mt-0.5">Kelola konfirmasi, data IMEI, dan bukti unggahan pelanggan</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadOrders()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow">Muat Ulang Data</button>
                <button onclick="logoutAdmin()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow">Keluar</button>
            </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-slate-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-900/90 text-xs font-semibold uppercase text-slate-400 border-b border-slate-700">
                        <th class="p-3">ID Pesanan</th>
                        <th class="p-3">Waktu</th>
                        <th class="p-3">Nama</th>
                        <th class="p-3">WhatsApp</th>
                        <th class="p-3">IMEI</th>
                        <th class="p-3">Bukti</th>
                        <th class="p-3">Paket</th>
                        <th class="p-3">Tagihan</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Aksi Status</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody" class="text-sm divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Pratinjau Gambar -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4" onclick="closeModal()">
        <div class="relative max-w-2xl w-full bg-slate-800 p-3 rounded-2xl border border-slate-700" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-2 px-2">
                <span class="text-xs text-slate-400 font-medium">Pratinjau Bukti / Tangkapan Layar</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold bg-slate-700 rounded-full w-6 h-6 flex items-center justify-center">✕</button>
            </div>
            <img id="modalImg" src="" alt="Bukti Pesanan" class="w-full max-h-[80vh] object-contain rounded-xl bg-slate-900">
        </div>
    </div>

    <script>
        const loginCard = document.getElementById('loginCard');
        const adminPanel = document.getElementById('adminPanel');
        const loginForm = document.getElementById('loginForm');
        const adminPassInput = document.getElementById('adminPassInput');
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');

        function getAuthToken() {
            return sessionStorage.getItem('admin_token');
        }

        if (getAuthToken()) {
            showDashboard();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = adminPassInput.value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_token', password);
                    showDashboard();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Gagal menghubungi server');
            }
        });

        function showDashboard() {
            loginCard.classList.add('hidden');
            adminPanel.classList.remove('hidden');
            loadOrders();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('admin_token');
            adminPanel.classList.add('hidden');
            loginCard.classList.remove('hidden');
            adminPassInput.value = '';
        }

        function openModal(imgSrc) {
            modalImg.src = imgSrc;
            imageModal.classList.remove('hidden');
        }

        function closeModal() {
            imageModal.classList.add('hidden');
            modalImg.src = '';
        }

        async function loadOrders() {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '<tr><td colspan="10" class="p-6 text-center text-slate-400">Memuat data...</td></tr>';

            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-password': getAuthToken() }
                });

                if (res.status === 401) {
                    logoutAdmin();
                    return;
                }

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="p-6 text-center text-slate-400">Belum ada pesanan masuk.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(order => {
                    const statusBadge = order.status === 'Selesai' 
                        ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                        : order.status === 'Diproses' 
                        ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' 
                        : 'bg-amber-500/20 text-amber-400 border border-amber-500/30';

                    const buktiView = order.imagePath 
                        ? `<button onclick="openModal('${order.imagePath}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-blue-300 font-medium px-2.5 py-1 rounded-lg border border-slate-600 flex items-center gap-1">
                             <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                             Lihat Foto
                           </button>`
                        : '<span class="text-xs text-slate-500 italic">-</span>';

                    return `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="p-3 font-mono font-bold text-white text-xs">${order.id}</td>
                            <td class="p-3 text-slate-400 text-xs">${order.createdAt}</td>
                            <td class="p-3 font-medium text-slate-200">${order.name}</td>
                            <td class="p-3">
                                <a href="https://wa.me/${order.phone.replace(/[^0-9]/g, '')}" target="_blank" class="text-emerald-400 hover:underline font-mono text-xs">
                                    ${order.phone}
                                </a>
                            </td>
                            <td class="p-3 font-mono text-xs text-slate-300">${order.imei}</td>
                            <td class="p-3">${buktiView}</td>
                            <td class="p-3 text-xs text-slate-300">${order.package || '-'}</td>
                            <td class="p-3 font-bold text-emerald-400 text-xs">Rp ${Number(order.price || 0).toLocaleString('id-ID')}</td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${statusBadge}">${order.status}</span>
                            </td>
                            <td class="p-3 text-center space-x-1 whitespace-nowrap">
                                <button onclick="updateStatus('${order.id}', 'Diproses')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded-lg transition font-medium">Proses</button>
                                <button onclick="updateStatus('${order.id}', 'Selesai')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg transition font-medium">Selesai</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="10" class="p-6 text-center text-rose-400">Gagal memuat data dari server.</td></tr>';
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch('/api/admin/orders/update-status', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-password': getAuthToken()
                    },
                    body: JSON.stringify({ id, status: newStatus })
                });
                const result = await res.json();
                if (result.success) {
                    loadOrders();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('Gagal memperbarui status');
            }
        }
    </script>
</body>
</html>
